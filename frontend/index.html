<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="S2 NAS - ระบบจัดเก็บเอกสารและไฟล์บนเซิร์ฟเวอร์" />

    <!--
      สีแถบบนของเบราว์เซอร์ต้องตามธีมที่ผู้ใช้เลือก ไม่ใช่ค่าเดียวตายตัว
      มิฉะนั้นแถบสถานะจะเป็นสีขาวสว่างคาดอยู่เหนือแอปสีเข้ม
    -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#162034" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="S2 NAS" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>S2 NAS - ระบบจัดเก็บเอกสารและไฟล์บนเซิร์ฟเวอร์</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('s2-theme');
          var theme = saved === 'light' || saved === 'dark' ? saved : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch (_) { document.documentElement.setAttribute('data-theme', 'light'); }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
